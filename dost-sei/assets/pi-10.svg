<text x="35" y="34" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="850" fill="#1A237E">Q10 — Follow the operators from left to right.</text><text x="50" y="78" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#6B7280">Rules:</text><rect x="115" y="58" width="48" height="48" rx="7" fill="#F3F4F6" stroke="#111827" stroke-width="2"/><text x="139" y="89" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="850" fill="#111827">I</text><text x="173" y="88" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650" fill="#111827">invert colors</text><rect x="320" y="58" width="48" height="48" rx="7" fill="#F3F4F6" stroke="#111827" stroke-width="2"/><text x="344" y="89" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="850" fill="#111827">R</text><text x="378" y="88" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650" fill="#111827">rotate 90° clockwise</text><rect x="620" y="58" width="48" height="48" rx="7" fill="#F3F4F6" stroke="#111827" stroke-width="2"/><text x="644" y="89" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="850" fill="#111827">S</text><text x="678" y="88" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650" fill="#111827">swap the two halves</text><rect x="90" y="145" width="100" height="100" rx="0" fill="white" stroke="#374151" stroke-width="2"/><rect x="108" y="165" width="54" height="23" rx="0" fill="#111827" stroke="#111827" stroke-width="2"/><rect x="108" y="192" width="54" height="23" rx="0" fill="white" stroke="#111827" stroke-width="2"/><text x="215" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="850" fill="#111827">→</text><rect x="250" y="170" width="48" height="48" rx="7