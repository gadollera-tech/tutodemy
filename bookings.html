<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="View and manage tutoring booking requests and completed sessions.">
  <meta name="theme-color" content="#11156f">
  <meta name="robots" content="noindex,nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="My Bookings | TutoDemy Learning PH">
  <meta property="og:description" content="View and manage tutoring booking requests and completed sessions.">
  <meta property="og:url" content="https://tutodemy.net/bookings.html">
  <meta property="og:image" content="https://tutodemy.net/assets/images/tutodemy-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>My Bookings | TutoDemy Learning PH</title>
  <link rel="icon" href="assets/images/owl-mark.png">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase-client.js"></script>
  <script defer src="js/auth-core.js"></script>
  <script defer src="js/cloud-sync.js"></script>
  <script defer src="js/marketplace-api.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/bookings.js"></script>
</head>
<body data-page="bookings">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="site-header"></div>
  <main id="main-content">
    <section class="page-hero bookings-hero">
      <div class="container page-hero-grid">
        <div><span class="eyebrow">MY TUTORING BOOKINGS</span><h1>Track every request from schedule to completion.</h1><p>See tutor responses, payment-confirmation status, completed sessions, and verified review options.</p><div class="button-row"><a class="button" href="tutoring.html">Find another tutor</a><a class="button button-outline" href="tutor-terms.html">Booking policy</a></div></div>
        <div class="booking-process-card"><span>REQUESTED</span><i>→</i><span>ACCEPTED</span><i>→</i><span>PAID</span><i>→</i><span>DELIVERED</span><i>→</i><span>COMPLETED</span></div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="marketplace-alert" id="bookings-alert" hidden></div>
        <div class="booking-tabs"><button class="active" data-booking-filter="active">Active</button><button data-booking-filter="completed">Completed</button><button data-booking-filter="closed">Cancelled or declined</button><button data-booking-filter="all">All</button></div>
        <div class="booking-list" id="booking-list" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
